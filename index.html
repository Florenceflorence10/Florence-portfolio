<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
  <title>MEMO LOG - Todo App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>MEMO LOG</h1>
      <img id="theme-toggle" src="images/icon-moon.svg" alt="Toggle theme" class="theme-toggle">
    </header>

    <main>
      <form class="add-todo-form">
        <div class="input-wrapper">
          <div class="radio-bg"></div>
          <input type="text" id="todo-input" placeholder="Type something..." autocomplete="off">
        </div>
        <button type="submit" id="add-btn" class="add-btn">+</button>
      </form>

      <div class="todos-section">        
        <div class="todos-info">
          <span id="items-left"><span>0</span> items left</span>
          <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
          </div>
          <button id="clear-completed" class="clear-completed">Clear Completed</button>
        </div>

        <ul id="todos-container" class="todos-list"></ul>
      </div>
    </main>

    <footer class="attribution">
      Inspired by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded for MEMO LOG.
    </footer>
  </div>

  <script src="src/script.js"></script>
</body>
</html>
